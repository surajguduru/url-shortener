{{- if .Values.postgres.enabled }}
# PostgreSQL as a single-replica StatefulSet: stable identity and a
# PersistentVolumeClaim that survives pod restarts and rescheduling.
# Not HA; a production setup would use a managed database or an operator
# (set postgres.enabled=false and database.externalHost).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shortener.name" . }}-postgres
  labels: {{- include "shortener.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "shortener.dbSelector" . | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "shortener.name" . }}-postgres
  labels:
    {{- include "shortener.labels" . | nindent 4 }}
    {{- include "shortener.dbSelector" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: {{ include "shortener.name" . }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "shortener.dbSelector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "shortener.dbSelector" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70        # "postgres" user in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.database.existingSecret }}, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.database.existingSecret }}, key: password } }
            - { name: POSTGRES_DB, value: {{ .Values.database.name | quote }} }
            # Subdirectory so initdb never trips over lost+found on the volume root.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
{{- end }}
